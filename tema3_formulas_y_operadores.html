/* =====================================================================
   SISTEMA DE DISEÑO — componentes reutilizables. No editar por subtema.
   ===================================================================== */

const Tarjeta = ({ children, className = "" }) => (
  <section className={"bg-white border border-borde rounded-xl2 p-5 sm:p-6 shadow-sm " + className}>
    {children}
  </section>
);

const Titulo = ({ children, id }) => (
  <h2 id={id} className="font-titulo text-xl sm:text-2xl font-bold text-azul mb-4">{children}</h2>
);

const Mono = ({ children }) => (
  <code className="font-mono bg-azulSuave border border-borde rounded px-1.5 py-0.5 text-azul">{children}</code>
);

/* ---------- 1. Encabezado ---------- */
function Encabezado({ meta }) {
  return (
    <header className="bg-azul text-white rounded-xl2 p-6 sm:p-8">
      <p className="font-titulo text-xs font-bold tracking-widest text-rejilla uppercase mb-2">
        {meta.etiqueta}
      </p>
      <h1 className="font-titulo text-2xl sm:text-4xl font-bold leading-tight mb-3">{meta.titulo}</h1>
      <p className="text-white/90 max-w-3xl leading-relaxed">{meta.intro}</p>
      {meta.secuencia && (
        <ol className="mt-5 flex flex-wrap gap-2">
          {meta.secuencia.map((p, i) => (
            <li key={i} className="flex items-center gap-2">
              <span className="bg-white/15 border border-white/25 rounded-xl2 px-3 py-1.5 text-sm">
                <span className="font-mono font-bold mr-1.5">{i + 1}</span>{p}
              </span>
              {i < meta.secuencia.length - 1 && <span aria-hidden="true" className="text-white/50">→</span>}
            </li>
          ))}
        </ol>
      )}
    </header>
  );
}

/* ---------- 2. Minihoja de Excel ---------- */
function Minihoja({ datos }) {
  const mapa = {};
  (datos.celdas || []).forEach(c => { mapa[c.ref] = c; });

  const fondo = t =>
    t === "captura" ? "bg-captura"
    : t === "formula" ? "bg-formula"
    : t === "activa"  ? "bg-[#FFFBEB] border-2 border-[#C9A200]"
    : "bg-white";

  return (
    <Tarjeta>
      <Titulo>{datos.titulo}</Titulo>
      <div className="overflow-x-auto" role="region" tabIndex="0"
           aria-label="Vista de hoja de cálculo. Se puede desplazar de lado.">
        <table className="w-full border-collapse min-w-[420px]">
          <thead>
            <tr>
              <th className="w-9 bg-rejilla border border-borde" aria-hidden="true"></th>
              {datos.columnas.map(c => (
                <th key={c} scope="col"
                    className="bg-rejilla border border-borde text-azul font-titulo font-bold py-1.5">
                  {c}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {datos.filas.map(f => (
              <tr key={f}>
                <th scope="row" className="bg-rejilla border border-borde text-azul font-titulo font-bold w-9">{f}</th>
                {datos.columnas.map(c => {
                  const ref = c + f;
                  const celda = mapa[ref];
                  return (
                    <td key={ref}
                        className={"border border-borde align-top p-2 h-14 " + fondo(celda && celda.tipo)}>
                      <span className="block text-[10px] font-mono text-[#9AA1A9] leading-none">{ref}</span>
                      {celda && (
                        <span className="block mt-1 font-mono font-bold text-texto">{celda.valor}</span>
                      )}
                      {celda && celda.etiqueta && (
                        <span className="mt-1 inline-block bg-azul text-white text-[10px] font-bold rounded px-1.5 py-0.5">
                          {celda.etiqueta}
                        </span>
                      )}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {datos.barraFormula && (
        <div className="mt-4 flex flex-wrap items-center gap-2 border border-borde rounded-xl2 bg-azulSuave px-3 py-2.5">
          <span className="font-mono font-bold text-azul border-r border-borde pr-3">fx</span>
          <span className="font-mono text-texto">{datos.barraFormula.formula}</span>
          <span aria-hidden="true" className="text-suave">→</span>
          <span className="font-mono text-suave">{datos.barraFormula.desarrollo}</span>
          <span aria-hidden="true" className="text-suave">=</span>
          <span className="font-mono font-bold bg-formula border border-borde rounded px-2 py-0.5">
            {datos.barraFormula.resultado}
          </span>
        </div>
      )}

      <ul className="mt-4 flex flex-wrap gap-x-6 gap-y-2 text-sm text-suave">
        <li className="flex items-center gap-2">
          <span className="w-4 h-4 rounded border border-borde bg-captura inline-block" aria-hidden="true"></span>
          Celda amarilla: aquí escribes tú el dato conocido.
        </li>
        <li className="flex items-center gap-2">
          <span className="w-4 h-4 rounded border border-borde bg-formula inline-block" aria-hidden="true"></span>
          Celda gris: la completa Excel; tú no la escribes.
        </li>
      </ul>
      {datos.nota && <p className="mt-2 text-xs text-suave">{datos.nota}</p>}
    </Tarjeta>
  );
}

/* ---------- 3. Pasos ---------- */
function Pasos({ datos }) {
  return (
    <Tarjeta>
      <Titulo>{datos.titulo}</Titulo>
      <ol className="grid gap-3 sm:grid-cols-2">
        {datos.lista.map((p, i) => (
          <li key={i} className="border border-borde rounded-xl2 p-4 bg-azulSuave/50">
            <div className="flex items-start gap-3">
              <span className="font-mono font-bold text-white bg-azul rounded-full w-7 h-7 flex items-center justify-center shrink-0">
                {i + 1}
              </span>
              <div>
                <p className="font-titulo font-bold text-azul">{p.titulo}</p>
                <p className="text-sm mt-1">{p.texto}</p>
              </div>
            </div>
          </li>
        ))}
      </ol>
      {datos.franja && (
        <div className="mt-4 border-l-4 border-azul bg-azulSuave rounded-r-xl2 px-4 py-3">
          <p className="font-titulo font-bold text-azul">
            {datos.franja.titulo}
            <span className="font-mono ml-3 text-texto">{datos.franja.secuencia}</span>
          </p>
          <p className="text-sm mt-1">{datos.franja.nota}</p>
        </div>
      )}
    </Tarjeta>
  );
}

/* ---------- 4. Fichas (columna derecha) ---------- */
function Fichas({ datos }) {
  return (
    <Tarjeta>
      <Titulo>{datos.titulo}</Titulo>
      <ol className="space-y-3">
        {datos.lista.map((f, i) => (
          <li key={i} className="border border-borde rounded-xl2 p-3">
            <div className="flex items-center gap-3">
              <span className="font-mono font-bold text-lg text-white bg-azul rounded-lg w-9 h-9 flex items-center justify-center shrink-0">
                {f.simbolo}
              </span>
              <p className="font-titulo font-bold text-azul">{f.nombre}</p>
            </div>
            <p className="text-sm mt-2">{f.definicion}</p>
            <p className="text-sm mt-1">
              <span className="text-suave">Ejemplo: </span><Mono>{f.ejemplo}</Mono>
            </p>
            <p className="text-sm mt-2 bg-alertaBg border-l-4 border-alerta rounded-r px-2 py-1">
              <span className="font-bold text-alerta">Error frecuente. </span>{f.error}
            </p>
          </li>
        ))}
      </ol>
    </Tarjeta>
  );
}

/* ---------- 5a. Calculadora viva ---------- */
function Calculadora({ datos }) {
  const [a, setA] = useState(datos.campos[0].valor);
  const [b, setB] = useState(datos.campos[1].valor);
  const [op, setOp] = useState(datos.operadores[0]);

  const refA = datos.campos[0].ref;
  const refB = datos.campos[1].ref;

  const resultado = useMemo(() => {
    const x = parseFloat(a), y = parseFloat(b);
    if (isNaN(x) || isNaN(y)) return "#¡VALOR!";
    if (op === "/" && y === 0) return "#¡DIV/0!";
    const r = op === "+" ? x + y : op === "-" ? x - y : op === "*" ? x * y : x / y;
    return String(Math.round(r * 10000) / 10000);
  }, [a, b, op]);

  const esError = resultado.startsWith("#");

  return (
    <div className="border border-borde rounded-xl2 p-4">
      <h3 className="font-titulo font-bold text-azul mb-3">{datos.titulo}</h3>
      <div className="grid gap-3 sm:grid-cols-3">
        <div>
          <label htmlFor="campo-a" className="block text-sm font-bold mb-1">{datos.campos[0].etiqueta}</label>
          <input id="campo-a" type="number" inputMode="decimal" value={a}
                 onChange={e => setA(e.target.value)}
                 className="w-full border border-borde rounded-lg px-3 py-2 font-mono bg-captura" />
        </div>
        <div>
          <label htmlFor="campo-op" className="block text-sm font-bold mb-1">Operador</label>
          <select id="campo-op" value={op} onChange={e => setOp(e.target.value)}
                  className="w-full border border-borde rounded-lg px-3 py-2 font-mono bg-white">
            {datos.operadores.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </div>
        <div>
          <label htmlFor="campo-b" className="block text-sm font-bold mb-1">{datos.campos[1].etiqueta}</label>
          <input id="campo-b" type="number" inputMode="decimal" value={b}
                 onChange={e => setB(e.target.value)}
                 className="w-full border border-borde rounded-lg px-3 py-2 font-mono bg-captura" />
        </div>
      </div>

      <div className="mt-4 flex flex-wrap items-center gap-2 bg-formula border border-borde rounded-xl2 px-3 py-2.5"
           aria-live="polite">
        <span className="font-mono font-bold text-azul">fx</span>
        <span className="font-mono">={refA}{op}{refB}</span>
        <span aria-hidden="true" className="text-suave">→</span>
        <span className={"font-mono font-bold px-2 py-0.5 rounded border " +
          (esError ? "bg-alertaBg border-alerta text-alerta" : "bg-white border-borde")}>
          {esError ? "⚠ " : ""}{resultado}
        </span>
      </div>
      <p className="text-sm text-suave mt-2">{datos.nota}</p>
    </div>
  );
}

/* ---------- 5b. Reto de escritura ---------- */
const normaliza = s => String(s).replace(/\s+/g, "").toUpperCase();

function Reto({ datos }) {
  const [i, setI] = useState(0);
  const [respuesta, setRespuesta] = useState("");
  const [veredicto, setVeredicto] = useState(null);   // {ok, mensaje}

  const reto = datos.lista[i];

  const validar = useCallback(() => {
    const r = normaliza(respuesta);
    if (!r) {
      setVeredicto({ ok: false, mensaje: "Escribe una fórmula antes de comprobar." });
      return;
    }
    if (!r.startsWith("=")) {
      setVeredicto({ ok: false, mensaje: "Falta el signo igual al principio. Toda fórmula empieza con =." });
      return;
    }
    const aceptadas = reto.respuestas.map(normaliza);
    if (aceptadas.includes(r)) {
      setVeredicto({ ok: true, mensaje: "Correcto. La fórmula está bien escrita." });
    } else {
      setVeredicto({ ok: false, mensaje: "Revisa la fórmula. " + reto.pista });
    }
  }, [respuesta, reto]);

  const nuevoReto = useCallback(() => {
    let j = i;
    if (datos.lista.length > 1) {
      while (j === i) j = Math.floor(Math.random() * datos.lista.length);
    }
    setI(j);
    setRespuesta("");
    setVeredicto(null);
  }, [i, datos.lista.length]);

  return (
    <div className="border border-borde rounded-xl2 p-4">
      <h3 className="font-titulo font-bold text-azul mb-3">{datos.titulo}</h3>
      <p className="text-sm text-suave mb-3">{datos.instruccion}</p>

      <p className="bg-azulSuave border-l-4 border-azul rounded-r-xl2 px-3 py-2 mb-3">{reto.enunciado}</p>

      <label htmlFor="campo-reto" className="block text-sm font-bold mb-1">Tu fórmula</label>
      <div className="flex flex-wrap gap-2">
        <input id="campo-reto" type="text" value={respuesta} autoComplete="off"
               onChange={e => setRespuesta(e.target.value)}
               onKeyDown={e => { if (e.key === "Enter") validar(); }}
               placeholder="=A1+B2"
               className="flex-1 min-w-[12rem] border border-borde rounded-lg px-3 py-2 font-mono bg-captura" />
        <button type="button" onClick={validar}
                className="bg-azul text-white font-titulo font-bold rounded-lg px-4 py-2 hover:bg-[#16324F]">
          Comprobar
        </button>
        <button type="button" onClick={nuevoReto}
                className="border border-azul text-azul font-titulo font-bold rounded-lg px-4 py-2 hover:bg-azulSuave">
          Nuevo reto
        </button>
      </div>

      <div aria-live="polite" className="mt-3 min-h-[2.5rem]">
        {veredicto && (
          <p className={"flex items-start gap-2 rounded-xl2 px-3 py-2 border-l-4 " +
            (veredicto.ok
              ? "bg-exitoBg border-exito text-exito"
              : "bg-alertaBg border-alerta text-alerta")}>
            <span aria-hidden="true" className="font-bold">{veredicto.ok ? "✔" : "✖"}</span>
            <span className="font-bold">{veredicto.ok ? "Correcto." : "Incorrecto."}</span>
            <span className="text-texto font-normal">{veredicto.mensaje}</span>
          </p>
        )}
      </div>
    </div>
  );
}

/* ---------- 5. Laboratorio ---------- */
function Laboratorio({ datos }) {
  return (
    <Tarjeta>
      <Titulo>{datos.titulo}</Titulo>
      <div className="space-y-4">
        {datos.calculadora && <Calculadora datos={datos.calculadora} />}
        {datos.reto && <Reto datos={datos.reto} />}
      </div>
    </Tarjeta>
  );
}

/* ---------- 6. Errores frecuentes ---------- */
function Errores({ datos }) {
  return (
    <Tarjeta>
      <Titulo>{datos.titulo}</Titulo>
      <ul className="grid gap-3 sm:grid-cols-3">
        {datos.lista.map((e, i) => (
          <li key={i} className="border border-borde rounded-xl2 p-4 bg-alertaBg/40">
            <p className="font-mono font-bold text-alerta">{e.codigo}</p>
            <p className="text-sm mt-2">{e.explicacion}</p>
            <p className="text-sm mt-2">
              <span className="text-suave">Solución: </span><Mono>{e.solucion}</Mono>
            </p>
          </li>
        ))}
      </ul>
      {datos.teclas && (
        <p className="mt-4 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
          {datos.teclas.map((t, i) => (
            <span key={i} className="flex items-center gap-2">
              <kbd>{t.tecla}</kbd> {t.accion}
            </span>
          ))}
        </p>
      )}
    </Tarjeta>
  );
}

/* ---------- 7. Cierre ---------- */
function Cierre({ datos }) {
  return (
    <Tarjeta className="bg-exitoBg border-exito/40">
      <Titulo>{datos.titulo}</Titulo>
      <ul className="space-y-2">
        {datos.puntos.map((p, i) => (
          <li key={i} className="flex items-start gap-2">
            <span aria-hidden="true" className="text-exito font-bold">✔</span>
            <span>{p}</span>
          </li>
        ))}
      </ul>
    </Tarjeta>
  );
}

/* ---------- Composición ---------- */
function Infografia() {
  const c = CONTENIDO;
  return (
    <div className="w-full">
      <div className="max-w-[1280px] mx-auto px-4 py-6 sm:py-8">
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-8 space-y-6 min-w-0">
            <Encabezado meta={c.meta} />
            {c.minihoja && <Minihoja datos={c.minihoja} />}
            {c.pasos && <Pasos datos={c.pasos} />}
            {c.laboratorio && <Laboratorio datos={c.laboratorio} />}
            {c.errores && <Errores datos={c.errores} />}
            {c.cierre && <Cierre datos={c.cierre} />}
          </div>
          <aside className="lg:col-span-4 min-w-0">
            <div className="lg:sticky lg:top-6">
              {c.fichas && <Fichas datos={c.fichas} />}
            </div>
          </aside>
        </div>
        <footer className="mt-8 text-center text-sm text-suave">
          Excel Básico con Inteligencia Artificial · 23-I-2026-EXT-LP-01 · Datos ficticios para práctica.
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(<Infografia />);
</script>
